# This is a Databricks asset bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: bcfaf03b-052f-4ef2-8d9c-6446a792f837

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    root_path: /Workspace/Users/abdulmanan.linkedin@gmail.com/DEV/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/abdulmanan.linkedin@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/abdulmanan.linkedin@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: abdulmanan.linkedin@gmail.com
        level: CAN_MANAGE
